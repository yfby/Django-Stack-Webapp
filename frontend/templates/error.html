{% load static ui %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ code }} · PrintPilot</title><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="error-page">
<main class="error-card"><a class="brand dark-brand" href="{% url 'workspace:dashboard' %}"><span class="brand-mark">{% icon 'printer' %}</span>PrintPilot<span class="brand-dot">✳</span></a><p class="eyebrow">{{ code }}</p><h1>{% if code == 404 %}This page isn't available.{% elif code == 403 %}This action needs permission.{% else %}We couldn't finish that print.{% endif %}</h1><p>{{ message }}</p><a class="button primary" href="{% url 'workspace:dashboard' %}">Back to the shop floor</a>
</main>
</body></html>
